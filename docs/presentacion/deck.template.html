<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EntryLink + RemoteLink — Presentación Comercial</title>
<style>
  :root {
    --el-1:#1D4ED8; --el-2:#7C3AED; --el-3:#DB2777;
    --rl-1:#0F3557; --rl-2:#2FB89A;
    --ink:#0B1220; --navy:#0F172A; --slate:#334155; --muted:#64748B; --soft:#94A3B8;
    --line:#E3E8F3; --line-2:#EEF1F8; --bg:#F4F6FC;
    --grad-hdr: linear-gradient(90deg,#132B7C,#5B21B6);
    --grad-cover: linear-gradient(135deg,#080D26 0%,#122266 38%,#4C1D95 72%,#9D174D 100%);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink);
    text-rendering:optimizeLegibility;
  }

  /* Slide frame: 1280 x 720 (16:9) */
  .slide {
    width:1280px; height:720px; position:relative; overflow:hidden;
    background:#fff; display:flex; flex-direction:column;
    page-break-after:always; break-after:page;
  }
  @media screen {
    .slide { margin:26px auto; border-radius:16px; box-shadow:0 10px 40px rgba(15,23,42,.14); }
    body { padding:10px 0 40px; }
  }
  @page { size: 13.333in 7.5in; margin:0; }
  @media print { .slide { margin:0; border-radius:0; box-shadow:none; } }

  .snum { position:absolute; bottom:15px; right:26px; font-size:11px; font-weight:700; color:#C3CBDA; letter-spacing:.6px; }
  .foot { position:absolute; bottom:15px; left:44px; font-size:10px; font-weight:700; color:#C3CBDA; letter-spacing:1.1px; text-transform:uppercase; }

  /* Header */
  .shead { background:var(--grad-hdr); color:#fff; padding:20px 44px 18px; position:relative; flex-shrink:0; }
  .shead::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg,#3B82F6,#7C3AED,#DB2777); }
  .shead .eyebrow { font-size:10px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase; opacity:.75; margin-bottom:5px; display:flex; align-items:center; gap:7px; }
  .shead h2 { font-size:26px; font-weight:700; letter-spacing:-.5px; line-height:1.15; }
  .shead .sub { font-size:13px; opacity:.82; margin-top:4px; font-weight:400; }
  .shead.rl { background:linear-gradient(90deg,#0F3557,#177F73); }
  .shead.rl::after { background:linear-gradient(90deg,#2FB89A,#38BDF8,#0F3557); }
  .shead.dark { background:linear-gradient(90deg,#0F172A,#1E293B); }
  .sbody { padding:24px 44px 38px; flex:1; display:flex; flex-direction:column; }

  /* Cover */
  .cover { background:var(--grad-cover); color:#fff; padding:0; justify-content:center; align-items:center; }
  .cover .blob1 { position:absolute; width:900px; height:900px; right:-330px; top:-380px; border-radius:50%;
    background:radial-gradient(circle,rgba(124,58,237,.5),rgba(124,58,237,0) 62%); }
  .cover .blob2 { position:absolute; width:760px; height:760px; left:-300px; bottom:-380px; border-radius:50%;
    background:radial-gradient(circle,rgba(59,130,246,.45),rgba(59,130,246,0) 62%); }
  .cover-inner { position:relative; z-index:2; padding:0 78px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:19px; }
  .logo-row { display:flex; align-items:center; gap:20px; }
  .logo-tile { background:#fff; border-radius:18px; padding:12px 20px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 34px rgba(2,6,23,.34); }
  .logo-tile img { display:block; }
  .logo-tile.el img { height:58px; }
  .logo-tile.rl { padding:7px; border-radius:19px; }
  .logo-tile.rl img { height:72px; border-radius:13px; }
  .plus { font-size:24px; font-weight:300; opacity:.5; }
  .cover h1 { font-size:39px; font-weight:800; letter-spacing:-1.1px; line-height:1.16; max-width:880px; }
  .cover h1 em { font-style:normal; background:linear-gradient(90deg,#A78BFA,#F472B6); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .cover p.lead { font-size:16px; line-height:1.6; opacity:.85; max-width:720px; }
  .cover-stats { display:flex; margin-top:4px; background:rgba(255,255,255,.09);
    border:1.5px solid rgba(255,255,255,.2); border-radius:16px; overflow:hidden; }
  .cstat { padding:14px 30px; text-align:center; border-right:1px solid rgba(255,255,255,.14); }
  .cstat:last-child { border-right:none; }
  .cstat .v { font-size:24px; font-weight:800; line-height:1; }
  .cstat .l { font-size:9px; opacity:.74; text-transform:uppercase; letter-spacing:1.1px; margin-top:6px; font-weight:700; }
  .tag { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.26); border-radius:100px;
    padding:6px 20px; font-size:11px; font-weight:700; letter-spacing:1.3px; text-transform:uppercase; }
  .cover-foot { position:absolute; bottom:24px; left:0; right:0; text-align:center; font-size:10.5px; opacity:.5; letter-spacing:1.4px; text-transform:uppercase; z-index:2; }

  /* Icons */
  .ic { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .ic-lg { width:25px; height:25px; }
  .ic-sm { width:14px; height:14px; stroke-width:2.2; }
  .icbox { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#fff; }
  .icbox.sm { width:32px; height:32px; border-radius:9px; }
  .icbox.blue { background:linear-gradient(135deg,#2563EB,#3B82F6); }
  .icbox.violet { background:linear-gradient(135deg,#6D28D9,#8B5CF6); }
  .icbox.pink { background:linear-gradient(135deg,#BE185D,#EC4899); }
  .icbox.teal { background:linear-gradient(135deg,#0F3557,#2FB89A); }
  .icbox.amber { background:linear-gradient(135deg,#B45309,#F59E0B); }
  .icbox.green { background:linear-gradient(135deg,#047857,#10B981); }
  .icbox.slate { background:linear-gradient(135deg,#334155,#64748B); }
  .icbox.red { background:linear-gradient(135deg,#B91C1C,#EF4444); }

  /* Cards & grids */
  .g2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .g3 { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; }
  .g4 { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .grow { flex:1 1 auto; grid-auto-rows:1fr; align-content:stretch; }
  .grow > .prob { align-items:center; }
  .sbody.centered { justify-content:center; }
  .spread { justify-content:space-between; }
  .card { border:1.5px solid var(--line); border-radius:14px; padding:15px 16px; background:#fff; display:flex; flex-direction:column; }
  .card.tint { background:#FBFCFF; }
  .card h3 { font-size:13.5px; font-weight:700; color:var(--navy); letter-spacing:-.2px; }
  .card p { font-size:11.6px; line-height:1.55; color:var(--muted); margin-top:5px; }
  .card .row { display:flex; gap:12px; align-items:flex-start; }
  .card-h { display:flex; align-items:center; gap:11px; margin-bottom:7px; }
  .card-h h3 { font-size:14.5px; }

  ul.chk { list-style:none; display:flex; flex-direction:column; gap:6px; }
  ul.chk li { display:flex; gap:8px; font-size:11.8px; line-height:1.45; color:var(--slate); }
  ul.chk li svg { color:#7C3AED; margin-top:1px; }
  ul.chk.t li svg { color:#0F766E; }
  ul.chk li b { color:var(--navy); font-weight:700; }

  .pill { display:inline-flex; align-items:center; gap:5px; background:#F1F5FE; border:1px solid #DCE5FA;
    color:#3730A3; border-radius:100px; padding:4px 11px; font-size:10.2px; font-weight:700; }
  .pill.t { background:#ECFBF6; border-color:#CDEFE5; color:#0F766E; }
  .pill.a { background:#FEF6E7; border-color:#FBE3B8; color:#92400E; }
  .pill.g { background:#EDFCF3; border-color:#C6EFD8; color:#166534; }
  .pill.r { background:#FEF1F1; border-color:#FBD5D5; color:#991B1B; }
  .pill.s { background:#F4F6FA; border-color:#E2E8F0; color:#475569; }
  .pills { display:flex; gap:6px; flex-wrap:wrap; }

  .band { margin-top:auto; border-radius:13px; padding:13px 19px; display:flex; align-items:center; gap:14px;
    background:linear-gradient(90deg,#F4F1FE,#FDF2F8); border:1.5px solid #EBE3FB; }
  .band .icbox { width:33px; height:33px; border-radius:10px; }
  .band b { color:var(--navy); font-weight:700; font-size:12.5px; }
  .band span { font-size:11.6px; color:var(--muted); line-height:1.5; }
  .band.t { background:linear-gradient(90deg,#EDFBF7,#EFF6FF); border-color:#CFEDE5; }
  .band.d { background:linear-gradient(90deg,#0F172A,#1E293B); border-color:#0F172A; }
  .band.d b { color:#fff; } .band.d span { color:#CBD5E1; }

  .sec-lbl { font-size:9.5px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--soft); margin-bottom:9px; display:flex; align-items:center; gap:9px; }
  .sec-lbl::after { content:''; flex:1; height:1px; background:var(--line-2); }

  /* Problem cards */
  .prob { border:1.5px solid var(--line); border-left:4px solid #EC4899; border-radius:12px; padding:13px 15px; display:flex; gap:12px; align-items:flex-start; }
  .prob h3 { font-size:13px; font-weight:700; color:var(--navy); }
  .prob p { font-size:11.3px; color:var(--muted); line-height:1.5; margin-top:4px; }
  .prob .icbox { width:34px; height:34px; border-radius:10px; }

  /* Ecosystem diagram */
  .eco { display:grid; grid-template-columns:1fr 190px 1fr; gap:0; align-items:stretch; }
  .eco-card { border:2px solid var(--line); border-radius:16px; padding:18px 20px; background:#fff; display:flex; flex-direction:column; }
  .eco-card.el { border-color:#DCD3FB; background:linear-gradient(180deg,#FBFAFF,#fff); }
  .eco-card.rl { border-color:#CDEFE5; background:linear-gradient(180deg,#F7FDFB,#fff); }
  .eco-card .top { display:flex; align-items:center; gap:11px; margin-bottom:4px; }
  .eco-card .name { font-size:19px; font-weight:800; letter-spacing:-.5px; color:var(--navy); }
  .eco-card .who { font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--soft); margin-top:2px; }
  .eco-card .desc { font-size:11.8px; color:var(--muted); line-height:1.55; margin:9px 0 11px; }
  .eco-card .pills { margin-top:auto; padding-top:14px; }
  .eco-mid { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; padding:0 8px; }
  .eco-core { width:150px; border-radius:16px; background:linear-gradient(160deg,#0F172A,#1E293B); color:#fff; padding:15px 12px; text-align:center; box-shadow:0 10px 26px rgba(15,23,42,.24); }
  .eco-core .t { font-size:12.5px; font-weight:800; letter-spacing:-.2px; margin-top:8px; }
  .eco-core .d { font-size:9.8px; color:#94A3B8; line-height:1.45; margin-top:5px; }
  .eco-core .icbox { margin:0 auto; }
  .eco-link { display:flex; align-items:center; gap:5px; font-size:9.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:#94A3B8; }
  .eco-line { height:2px; width:100%; background:linear-gradient(90deg,#C7D2FE,#A7F3D0); }

  /* Phone mockup */
  .phone { width:212px; height:418px; border-radius:26px; background:#0F172A; padding:7px 6px; box-shadow:0 16px 38px rgba(15,23,42,.28); flex-shrink:0; position:relative; }
  .phone .scr { width:100%; height:100%; border-radius:20px; background:#F1F5F9; overflow:hidden; display:flex; flex-direction:column; }
  .phone .bar { background:linear-gradient(120deg,#0F3557,#177F73); color:#fff; padding:12px 12px 13px; }
  .phone .bar .hi { font-size:8.5px; opacity:.75; letter-spacing:.4px; }
  .phone .bar .nm { font-size:13px; font-weight:800; margin-top:1px; }
  .phone .bar .un { font-size:8.5px; opacity:.8; margin-top:3px; }
  .phone .bdy { padding:9px; display:flex; flex-direction:column; gap:8px; }
  .phone .mini { background:#fff; border:1px solid #E2E8F0; border-radius:11px; padding:9px 10px; }
  .phone .mini .lbl { font-size:7.5px; color:#94A3B8; text-transform:uppercase; letter-spacing:.8px; font-weight:800; }
  .phone .mini .val { font-size:17px; font-weight:800; color:#0F172A; margin-top:2px; letter-spacing:-.5px; }
  .phone .mini .sub { font-size:8px; color:#64748B; margin-top:2px; }
  .phone .qa { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .phone .qa div { background:#fff; border:1px solid #E2E8F0; border-radius:10px; padding:9px 7px; text-align:center; font-size:8.5px; font-weight:700; color:#334155; }
  .phone .qa div svg { color:#0F3557; margin-bottom:3px; }
  .phone .notif { background:#fff; border:1px solid #E2E8F0; border-radius:10px; padding:8px 9px; display:flex; gap:7px; align-items:center; }
  .phone .notif .dot { width:6px; height:6px; border-radius:50%; background:#EF4444; flex-shrink:0; }
  .phone .notif .tx { font-size:8px; color:#334155; line-height:1.35; }
  .phone .fab { position:absolute; right:14px; bottom:16px; width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg,#DC2626,#EF4444); color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(220,38,38,.5); border:2.5px solid rgba(255,255,255,.9); }

  /* Timeline */
  .flow { display:grid; grid-template-columns:repeat(6,1fr); gap:11px; position:relative; }
  .fstep { border:1.5px solid var(--line); border-radius:13px; padding:13px 12px 14px; background:#fff; position:relative; }
  .fstep .n { position:absolute; top:-11px; left:12px; width:23px; height:23px; border-radius:50%; color:#fff;
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1D4ED8,#7C3AED); border:2.5px solid #fff; }
  .fstep .icbox { width:30px; height:30px; border-radius:9px; margin:6px 0 8px; }
  .fstep h3 { font-size:11.8px; font-weight:750; color:var(--navy); line-height:1.25; }
  .fstep p { font-size:10.3px; color:var(--muted); line-height:1.45; margin-top:5px; }
  .fstep .who { font-size:8.5px; font-weight:800; letter-spacing:.7px; text-transform:uppercase; margin-top:8px; }
  .who.el { color:#7C3AED; } .who.rl { color:#0F766E; }

  /* Actor columns */
  .actor { border:1.5px solid var(--line); border-radius:15px; overflow:hidden; display:flex; flex-direction:column; }
  .actor .ah { padding:14px 17px; color:#fff; display:flex; align-items:center; gap:11px; }
  .actor .ah .t { font-size:14.5px; font-weight:750; letter-spacing:-.2px; }
  .actor .ah .s { font-size:10px; opacity:.82; margin-top:2px; }
  .actor .ab { padding:14px 17px 16px; flex:1; display:flex; flex-direction:column; justify-content:center; }
  .ah.b1 { background:linear-gradient(135deg,#1E3A8A,#2563EB); }
  .ah.b2 { background:linear-gradient(135deg,#5B21B6,#8B5CF6); }
  .ah.b3 { background:linear-gradient(135deg,#0F3557,#2FB89A); }

  /* Roadmap */
  .rcol { border:1.5px solid var(--line); border-radius:15px; padding:16px 18px; display:flex; flex-direction:column; justify-content:space-between; }
  .rcol.now { border-color:#C6EFD8; background:linear-gradient(180deg,#F7FEFA,#fff); }
  .rcol.next { border-color:#FBE3B8; background:linear-gradient(180deg,#FFFCF5,#fff); }
  .rcol .rh { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .rcol .rh .t { font-size:15px; font-weight:800; color:var(--navy); letter-spacing:-.3px; }
  .ritem { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--line-2); }
  .ritem:last-child { border-bottom:none; }
  .ritem .tx b { font-size:12px; font-weight:700; color:var(--navy); }
  .ritem .tx p { font-size:10.6px; color:var(--muted); line-height:1.45; margin-top:2px; }

  /* Steps */
  .stp { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
  .stpc { border:1.5px solid var(--line); border-radius:14px; padding:18px 16px; text-align:center; }
  .stpc .n { width:38px; height:38px; margin:0 auto 10px; border-radius:12px; color:#fff; font-size:16px; font-weight:800;
    display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#1D4ED8,#7C3AED); }
  .stpc h3 { font-size:13px; font-weight:750; color:var(--navy); }
  .stpc p { font-size:11px; color:var(--muted); line-height:1.5; margin-top:6px; }
  .stpc .when { font-size:9.5px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:#7C3AED; margin-top:9px; }

  /* CTA */
  .cta-box { background:rgba(255,255,255,.09); border:1.5px solid rgba(255,255,255,.22); border-radius:16px; padding:18px 26px; }
  .cta-box .l { font-size:9.5px; letter-spacing:1.4px; text-transform:uppercase; opacity:.65; font-weight:700; }
  .cta-box .v { font-size:15px; font-weight:700; margin-top:5px; display:flex; align-items:center; gap:9px; }
  .cta-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:900px; }
  .cta-why { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .cta-why span { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); border-radius:100px;
    padding:7px 16px; font-size:11.5px; font-weight:600; display:flex; align-items:center; gap:7px; }
</style>
</head>
