# Compila la app de iOS sin firmar en un macOS de GitHub.
# Sirve para saber que `pod install` y el build nativo pasan sin tener un Mac.
# No genera un .ipa instalable: la firma y TestFlight llegan cuando exista la
# cuenta de Apple Developer.
name: iOS build (sin firma)

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'App.tsx'
      - 'index.js'
      - 'package.json'
      - 'yarn.lock'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'Gemfile'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # SDK de iOS 26: lo pide react-native-camera-kit 18 y la App Store
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Versión de Xcode
        run: xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependencias JS
        run: yarn install --frozen-lockfile

      # Los .env no se versionan. Para compilar basta la plantilla con valores
      # de ejemplo; nunca se meten llaves reales en este repo público.
      - name: Crear .env.production de ejemplo
        run: cp .env.example .env.production

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Caché de Pods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('yarn.lock', 'ios/Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        working-directory: ios
        run: bundle exec pod install

      - name: Compilar (Release, iphoneos, sin firma)
        # Solo aquí: con NODE_ENV=production en el install, yarn omite las
        # devDependencies (patch-package incluido). babel.config.js elige el
        # .env según BUILD_ENV al empaquetar el JS.
        env:
          BUILD_ENV: production
          NODE_ENV: production
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/remotelink.xcworkspace \
            -scheme remotelink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | xcbeautify

      - name: Subir log de xcodebuild
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
