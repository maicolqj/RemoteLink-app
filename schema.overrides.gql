# =============================================================================
# schema.overrides.gql
#
# Definiciones que la app YA consume pero que aún no existen en el schema.gql
# que publica el backend, porque viven en ramas suyas sin mergear.
#
# Existe porque `schema.gql` es un espejo automático: el watcher
# C:\Users\maico\Apps\sync-schema.ps1 lo sobrescribe con el schema de la rama
# que el backend tenga activa en ese momento. Parchear `schema.gql` a mano no
# sirve — el siguiente sync borra el parche y codegen vuelve a fallar. Este
# archivo, en cambio, sobrevive a cualquier sincronización.
#
# codegen.ts carga ambos archivos y los fusiona.
#
# MANTENIMIENTO: cada bloque debe desaparecer en cuanto su rama del backend se
# mergee.
#
# Ojo: un `extend input` que repita campos IDÉNTICOS a los del espejo NO hace
# fallar a codegen — la fusión los deduplica en silencio (verificado el
# 2026-08-05: espejo y override declarando los mismos cuatro campos, salida
# generada idéntica). Solo choca al redefinir un tipo completo (`type X`) o al
# declarar un campo con otro tipo. Es decir: aquí no hay error que te avise,
# hay que acordarse de borrar.
#
# Estado actual: SIN overrides activos.
# Los bloques de `resend-system-code-whatsapp` y de la autenticación de
# residentes 0.0.15 se eliminaron el 2026-08-01, cuando el espejo pasó a traerlos
# ya definidos (el segundo, además, con `DeviceApprovalStatusResponse.status`
# tipado como enum en vez de String, que es lo que hacía fallar la fusión).
#
# El bloque de metadata de equipo en `SaveMobileTokenInput` (rama backend
# `feat/panic-alert-aggregate`) se eliminó el 2026-08-06 al mergear el PR #138:
# el espejo ya declara `manufacturer`, `deviceModel`, `osVersion` y `appVersion`.
# =============================================================================

# ── AVISO sobre el espejo ────────────────────────────────────────────────────
# El 2026-08-05 el watcher regeneró `schema.gql` desde una rama del backend
# anterior al ingreso con documento + clave y se llevó por delante
# `LoginAccessCodeInput.identity`, `.label` y `NotificationType.NEW_DEVICE_LINKED`,
# que la app sí usa. Se restauró el espejo con `git checkout -- schema.gql`.
#
# Si vuelve a pasar, la salida ya no compila igual: el arreglo es restaurar el
# espejo, no parchear aquí. Un `extend` de algo que el espejo sí trae hace fallar
# codegen por definición duplicada — que es justamente cómo se detecta.
#
# Nota de sintaxis para el próximo bloque real: `extend` NO admite descripciones
# (`"""…"""`) sobre sí mismo; usar comentarios `#` o codegen no parsea el archivo.
