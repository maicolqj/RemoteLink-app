# =============================================================================
# schema.overrides.gql
#
# Definiciones que la app YA consume pero que aún no existen en el schema.gql
# que publica el backend, porque viven en ramas suyas sin mergear.
#
# Existe porque `schema.gql` es un espejo automático: el watcher
# C:\Users\maico\Apps\sync-schema.ps1 lo sobrescribe con el schema de la rama
# que el backend tenga activa en ese momento. Parchear `schema.gql` a mano no
# sirve — el siguiente sync borra el parche y codegen vuelve a fallar. Este
# archivo, en cambio, sobrevive a cualquier sincronización.
#
# codegen.ts carga ambos archivos y los fusiona.
#
# MANTENIMIENTO: cada bloque debe desaparecer en cuanto su rama del backend se
# mergee.
#
# Ojo: un `extend input` que repita campos IDÉNTICOS a los del espejo NO hace
# fallar a codegen — la fusión los deduplica en silencio (verificado el
# 2026-08-05: espejo y override declarando los mismos cuatro campos, salida
# generada idéntica). Solo choca al redefinir un tipo completo (`type X`) o al
# declarar un campo con otro tipo. Es decir: aquí no hay error que te avise,
# hay que acordarse de borrar.
#
# Estado actual: 1 override activo (zonas comunes).
# Los bloques de `resend-system-code-whatsapp` y de la autenticación de
# residentes 0.0.15 se eliminaron el 2026-08-01, cuando el espejo pasó a traerlos
# ya definidos (el segundo, además, con `DeviceApprovalStatusResponse.status`
# tipado como enum en vez de String, que es lo que hacía fallar la fusión).
#
# El bloque de metadata de equipo en `SaveMobileTokenInput` (rama backend
# `feat/panic-alert-aggregate`) se eliminó el 2026-08-06 al mergear el PR #138:
# el espejo ya declara `manufacturer`, `deviceModel`, `osVersion` y `appVersion`.
# =============================================================================

# ── AVISO sobre el espejo ────────────────────────────────────────────────────
# El 2026-08-05 el watcher regeneró `schema.gql` desde una rama del backend
# anterior al ingreso con documento + clave y se llevó por delante
# `LoginAccessCodeInput.identity`, `.label` y `NotificationType.NEW_DEVICE_LINKED`,
# que la app sí usa. Se restauró el espejo con `git checkout -- schema.gql`.
#
# Si vuelve a pasar, la salida ya no compila igual: el arreglo es restaurar el
# espejo, no parchear aquí. Un `extend` de algo que el espejo sí trae hace fallar
# codegen por definición duplicada — que es justamente cómo se detecta.
#
# Nota de sintaxis para el próximo bloque real: `extend` NO admite descripciones
# (`"""…"""`) sobre sí mismo; usar comentarios `#` o codegen no parsea el archivo.
# =============================================================================

# ── Backend: rama feat/reserva-zonas-comunes ─────────────────────────────────
# App: src/domain/graphql/amenities.queries.ts. Reserva de zonas comunes desde
# la app del residente: catálogo, disponibilidad, crear y cancelar reserva.
# El residente NO ve el cobro por daños ni la administración de zonas; esos
# campos viajan igual en el tipo porque el schema es uno solo.
# Borrar este bloque completo cuando el backend mergee la rama.

extend type Query {
  amenities(complexId: String!, pagination: PaginationInput, filters: FilterAmenitiesInput): PaginatedAmenitiesResponse!
  amenity(amenityId: String!): Amenity!
  amenityAvailability(input: AmenityAvailabilityInput!): AmenityAvailabilityResponse!
  amenityBlackouts(amenityId: String!): [AmenityBlackout!]!
  amenityBookings(complexId: String!, pagination: PaginationInput, filters: FilterAmenityBookingsInput): PaginatedAmenityBookingsResponse!
  myUnitAmenityBookings(complexId: String!, pagination: PaginationInput, filters: FilterAmenityBookingsInput): PaginatedAmenityBookingsResponse!
  amenityBooking(bookingId: String!): AmenityBooking!
  myAmenityCouncilQuota(amenityId: String!): AmenityCouncilQuotaResponse!
}

extend type Mutation {
  createAmenity(input: CreateAmenityInput!): Amenity!
  updateAmenity(input: UpdateAmenityInput!): Amenity!
  deleteAmenity(amenityId: String!): Boolean!
  setAmenitySchedules(input: SetAmenitySchedulesInput!): Amenity!
  createAmenityBlackout(input: CreateAmenityBlackoutInput!): AmenityBlackout!
  deleteAmenityBlackout(blackoutId: String!): Boolean!
  createAmenityBooking(input: CreateAmenityBookingInput!): AmenityBooking!
  approveAmenityBooking(bookingId: String!): AmenityBooking!
  rejectAmenityBooking(input: RejectAmenityBookingInput!): AmenityBooking!
  cancelAmenityBooking(input: CancelAmenityBookingInput!): AmenityBooking!
  checkInAmenityBooking(complexId: String!, accessCode: String!): AmenityBooking!
  checkOutAmenityBooking(bookingId: String!): AmenityBooking!
  chargeAmenityDamage(input: ChargeAmenityDamageInput!): AmenityBooking!
}
"""Horario semanal de apertura de una zona común"""
type AmenitySchedule {
  id: ID!
  amenityId: String!
  amenity: Amenity
  complexId: String!

  """0=domingo, 1=lunes … 6=sábado"""
  dayOfWeek: Int!

  """Hora de apertura en formato HH:mm"""
  openTime: String!

  """Hora de cierre en formato HH:mm"""
  closeTime: String!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""Zona común reservable del complejo residencial"""
type Amenity {
  id: ID!

  """Nombre visible (ej. Salón Comunal Piso 1)"""
  name: String!
  description: String
  type: AmenityType!
  status: AmenityStatus!
  location: String
  rules: String

  """URLs de fotos de la zona (R2)"""
  imageUrls: [String!]
  bookingMode: AmenityBookingMode!
  durationUnit: AmenityDurationUnit!
  slotDurationMinutes: Int!
  minDurationMinutes: Int!
  maxDurationMinutes: Int!
  capacity: Int!
  maxSimultaneousBookings: Int!
  advanceBookingDays: Int!
  minAdvanceDays: Int!
  cancellationDeadlineDays: Int!
  cancellationDeadlineHours: Int!
  lateCancellationFeePercent: Int!
  councilFreeBookingsPerYear: Int!
  maxActiveBookingsPerUnit: Int!
  maxBookingsPerUnitPerMonth: Int!

  """
  Si es true la reserva nace en PENDING y la administración debe aprobarla
  """
  requiresApproval: Boolean!

  """Si es true, una unidad con saldo vencido no puede reservar"""
  blockBookingsOnDebt: Boolean!
  feeType: AmenityFeeType!
  feeAmount: Float!
  complexId: String!
  complex: ResidentialComplex
  schedules: [AmenitySchedule!]
  createdByUserId: String
  updatedByUserId: String
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

"""Tipo de zona común del complejo residencial"""
enum AmenityType {
  SALON_COMUNAL
  ZONA_BBQ
  PISCINA
  GIMNASIO
  CANCHA
  COWORKING
  SAUNA
  TERRAZA
  PARQUE_INFANTIL
  TEATRINO
  OTRO
}

"""Estado operativo de la zona común"""
enum AmenityStatus {
  ACTIVE
  MAINTENANCE
  INACTIVE
}

"""Modo en que se reservan las franjas horarias de la zona común"""
enum AmenityBookingMode {
  SLOT
  RANGE
}

"""Unidad en que se expresan las duraciones de la zona común"""
enum AmenityDurationUnit {
  HOURS
  DAYS
}

"""Forma de cobro de la reserva de zona común"""
enum AmenityFeeType {
  FREE
  PER_BOOKING
  PER_HOUR
}

"""Bloqueo puntual de una zona común (mantenimiento, evento)"""
type AmenityBlackout {
  id: ID!
  amenityId: String!
  amenity: Amenity
  complexId: String!
  startAt: DateTime!
  endAt: DateTime!

  """Motivo visible para el residente"""
  reason: String!
  createdByUserId: String
  createdAt: DateTime!
}

"""Reserva de zona común hecha por una unidad"""
type AmenityBooking {
  id: ID!
  amenityId: String!
  amenity: Amenity
  startAt: DateTime!
  endAt: DateTime!
  attendees: Int!
  purpose: String
  notes: String
  unitId: String!
  unit: Unit
  residentId: String
  requestedByUserId: String
  requestedByName: String
  status: AmenityBookingStatus!
  approvedByUserId: String
  approvedAt: DateTime
  rejectionReason: String
  cancelledByUserId: String
  cancelledAt: DateTime
  cancellationReason: String
  accessCode: String
  checkInAt: DateTime
  checkOutAt: DateTime
  checkedInByUserId: String
  feeAmount: Float!
  feeChargeId: String
  isCouncilFreeBooking: Boolean!
  lateCancellationAmount: Float!
  lateCancellationChargeId: String
  damageAmount: Float!
  damageDescription: String
  damageChargeId: String
  damageChargedAt: DateTime
  damageChargedByUserId: String
  complexId: String!
  complex: ResidentialComplex
  reminderSentAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
}

"""Estado de la reserva de zona común"""
enum AmenityBookingStatus {
  PENDING
  APPROVED
  REJECTED
  CANCELLED
  CHECKED_IN
  COMPLETED
  NO_SHOW
  EXPIRED
}

type PaginatedAmenitiesResponse {
  items: [Amenity!]!
  pagination: PaginationReponse!
}

"""Ventana de apertura de la zona común en un día"""
type AmenityTimeWindow {
  startAt: DateTime!
  endAt: DateTime!
}

"""Franja reservable de una zona común"""
type AmenitySlot {
  startAt: DateTime!
  endAt: DateTime!
  capacityTotal: Int!
  capacityUsed: Int!
  isAvailable: Boolean!
}

"""Intervalo ocupado por una reserva activa"""
type AmenityBusyRange {
  startAt: DateTime!
  endAt: DateTime!
  bookingsCount: Int!
}

"""Disponibilidad de una zona común en un día calendario"""
type AmenityAvailabilityDay {
  """Fecha en formato YYYY-MM-DD"""
  date: String!
  isOpen: Boolean!
  closedReason: String
  openWindows: [AmenityTimeWindow!]!
  slots: [AmenitySlot!]!
  busy: [AmenityBusyRange!]!
}

"""Disponibilidad de una zona común en un rango de días"""
type AmenityAvailabilityResponse {
  amenityId: String!
  days: [AmenityAvailabilityDay!]!
}

type PaginatedAmenityBookingsResponse {
  items: [AmenityBooking!]!
  pagination: PaginationReponse!
}

input FilterAmenitiesInput {
  status: AmenityStatus
  type: AmenityType

  """Búsqueda por nombre"""
  search: String
}

input AmenityAvailabilityInput {
  amenityId: String!

  """Primer día a consultar (YYYY-MM-DD)"""
  from: String!

  """Último día a consultar, inclusive (YYYY-MM-DD)"""
  to: String!
}

input FilterAmenityBookingsInput {
  status: AmenityBookingStatus
  amenityId: String
  unitId: String

  """Reservas que inician desde esta fecha (ISO 8601)"""
  startFrom: String

  """Reservas que inician hasta esta fecha (ISO 8601)"""
  startUntil: String
}

input CreateAmenityInput {
  complexId: String!
  name: String!
  description: String
  type: AmenityType! = OTRO
  status: AmenityStatus! = ACTIVE
  location: String

  """Reglamento de uso que ve el residente al reservar"""
  rules: String
  imageUrls: [String!]
  bookingMode: AmenityBookingMode! = SLOT
  durationUnit: AmenityDurationUnit! = HOURS

  """
  Solo SLOT: minutos de cada bloque. El rango válido depende de durationUnit
  """
  slotDurationMinutes: Int! = 120

  """
  Solo RANGE: duración mínima en minutos. El rango válido depende de durationUnit
  """
  minDurationMinutes: Int! = 60

  """
  Solo RANGE: duración máxima en minutos. El rango válido depende de durationUnit
  """
  maxDurationMinutes: Int! = 480

  """Aforo por reserva. 0 = sin control"""
  capacity: Int! = 0

  """Reservas que caben a la misma hora (ej. 4 asadores)"""
  maxSimultaneousBookings: Int! = 1
  advanceBookingDays: Int! = 30

  """Anticipación mínima en días. 0 = se puede reservar para hoy"""
  minAdvanceDays: Int! = 1

  """
  Días antes del inicio en que aún se puede cancelar sin quedar con el cobro
  """
  cancellationDeadlineDays: Int! = 1
  cancellationDeadlineHours: Int! = 0
  lateCancellationFeePercent: Int! = 100
  councilFreeBookingsPerYear: Int! = 0

  """0 = sin límite"""
  maxActiveBookingsPerUnit: Int! = 2

  """0 = sin límite"""
  maxBookingsPerUnitPerMonth: Int! = 0
  requiresApproval: Boolean! = true
  blockBookingsOnDebt: Boolean! = true
  feeType: AmenityFeeType! = FREE
  feeAmount: Float! = 0
  schedules: [AmenityScheduleInput!]
}

input AmenityScheduleInput {
  """0=domingo, 1=lunes … 6=sábado"""
  dayOfWeek: Int!

  """Hora de apertura HH:mm"""
  openTime: String!

  """Hora de cierre HH:mm"""
  closeTime: String!
}

input UpdateAmenityInput {
  name: String
  description: String
  type: AmenityType = OTRO
  status: AmenityStatus = ACTIVE
  location: String

  """Reglamento de uso que ve el residente al reservar"""
  rules: String
  imageUrls: [String!]
  bookingMode: AmenityBookingMode = SLOT
  durationUnit: AmenityDurationUnit = HOURS

  """
  Solo SLOT: minutos de cada bloque. El rango válido depende de durationUnit
  """
  slotDurationMinutes: Int = 120

  """
  Solo RANGE: duración mínima en minutos. El rango válido depende de durationUnit
  """
  minDurationMinutes: Int = 60

  """
  Solo RANGE: duración máxima en minutos. El rango válido depende de durationUnit
  """
  maxDurationMinutes: Int = 480

  """Aforo por reserva. 0 = sin control"""
  capacity: Int = 0

  """Reservas que caben a la misma hora (ej. 4 asadores)"""
  maxSimultaneousBookings: Int = 1
  advanceBookingDays: Int = 30

  """Anticipación mínima en días. 0 = se puede reservar para hoy"""
  minAdvanceDays: Int = 1

  """
  Días antes del inicio en que aún se puede cancelar sin quedar con el cobro
  """
  cancellationDeadlineDays: Int = 1
  cancellationDeadlineHours: Int = 0
  lateCancellationFeePercent: Int = 100
  councilFreeBookingsPerYear: Int = 0

  """0 = sin límite"""
  maxActiveBookingsPerUnit: Int = 2

  """0 = sin límite"""
  maxBookingsPerUnitPerMonth: Int = 0
  requiresApproval: Boolean = true
  blockBookingsOnDebt: Boolean = true
