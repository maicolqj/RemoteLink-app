input SetAmenitySchedulesInput {
  amenityId: String!
  schedules: [AmenityScheduleInput!]!
}

input CreateAmenityBlackoutInput {
  amenityId: String!

  """Inicio del bloqueo (ISO 8601)"""
  startAt: String!

  """Fin del bloqueo (ISO 8601)"""
  endAt: String!

  """Motivo visible para el residente"""
  reason: String!
}


"""Cupo anual del consejo de administración en una zona común"""
type AmenityCouncilQuotaResponse {
  isCouncilMember: Boolean!
  bookingsPerYear: Int!
  used: Int!
  remaining: Int!
  year: Int!
}

input CreateAmenityBookingInput {
  amenityId: String!

  """Inicio de la reserva (ISO 8601)"""
  startAt: String!

  """
  Fin de la reserva (ISO 8601). Exclusivo: 12:00 no choca con una reserva que empieza a las 12:00
  """
  endAt: String!
  attendees: Int! = 1

  """Usar el cupo anual del consejo si aplica"""
  useCouncilFreeQuota: Boolean! = true

  """Motivo del evento (ej. cumpleaños)"""
  purpose: String
  notes: String

  """Unidad a nombre de la cual se reserva (solo staff)"""
  unitId: String
}

input RejectAmenityBookingInput {
  bookingId: String!

  """Motivo del rechazo. Obligatorio: el residente debe saber por qué"""
  reason: String!
}

input CancelAmenityBookingInput {
  bookingId: String!
  reason: String
}

input ChargeAmenityDamageInput {
  bookingId: String!

  """Valor a cargar a la unidad"""
  amount: Float!

  """
  Qué se dañó y por qué se cobra. Lo ve el residente en su estado de cuenta
  """
  description: String!
}


# ── Backend: rama feat/pqrf ──────────────────────────────────────────────────
# Radicación de peticiones, quejas, reclamos y felicitaciones.
# Borrar este bloque completo cuando el backend mergee la rama.

"""Tipo de radicado"""
enum PqrfType {
  PETICION
  QUEJA
  RECLAMO
  SUGERENCIA
  FELICITACION
}

"""Instancia a la que se dirige el radicado"""
enum PqrfAddressee {
  ADMINISTRACION
  CONSEJO
  AMBOS
}

"""Estado del radicado"""
enum PqrfStatus {
  RADICADO
  EN_TRAMITE
  RESUELTO
}

"""Paso de un destinatario sobre el radicado"""
type PqrfAcknowledgement {
  id: String!
  userId: String!
  userName: String
  instance: PqrfAddressee!
  openedAt: DateTime!
  resolvedAt: DateTime
}

type Pqrf {
  id: String!
  code: String!
  consecutive: Int!
  type: PqrfType!
  addressee: PqrfAddressee!
  status: PqrfStatus!
  subject: String!
  description: String!
  residentId: String
  unitId: String
  unit: Unit
  requestedByUserId: String
  requestedByName: String
  complexId: String!
  acknowledgements: [PqrfAcknowledgement!]
  resolvedAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PaginatedPqrfResponse {
  items: [Pqrf!]!
  pagination: PaginationReponse!
}

input CreatePqrfInput {
  complexId: String!
  type: PqrfType!
  addressee: PqrfAddressee! = ADMINISTRACION
  subject: String!
  description: String!
}

input FilterPqrfInput {
  type: PqrfType
  status: PqrfStatus
  addressee: PqrfAddressee
  search: String
}

extend type Query {
  pqrfRequests(complexId: String!, pagination: PaginationInput, filters: FilterPqrfInput): PaginatedPqrfResponse!
  myPqrfRequests(complexId: String!, pagination: PaginationInput, filters: FilterPqrfInput): PaginatedPqrfResponse!
  pqrfRequest(pqrfId: String!): Pqrf!
}

extend type Mutation {
  createPqrf(input: CreatePqrfInput!): Pqrf!
  openPqrf(pqrfId: String!): Pqrf!
  resolvePqrf(pqrfId: String!): Pqrf!
}

# ── Backend: rama feat/pqrf (consejo de administración) ──────────────────────
# La marca vive en el rol COUNCIL_ROL; el backend la resuelve como campo del
# residente. Borrar cuando el backend mergee.
extend type Resident {
  """Miembro del consejo de administración"""
  isCouncilMember: Boolean!
}

# ── Backend: rama feat/pqrf (plazo y silencio administrativo) ────────────────
extend type Pqrf {
  """Hasta cuándo tiene el complejo para resolverlo"""
  dueAt: DateTime!
  """Se resolvió solo al vencerse el plazo, a favor de quien radicó"""
  resolvedBySilence: Boolean!
}

# ── Backend: quién del consejo responde los PQRF ─────────────────────────────
# La administración designa qué consejeros responden; los demás leen el
# radicado sin poder marcarlo. Borrar cuando el backend lo despliegue.
extend type Pqrf {
  """Quien consulta puede marcarlo como resuelto"""
  viewerCanResolve: Boolean!
  """Quien consulta ya marcó su parte"""
  viewerHasResolved: Boolean!
  """Quien consulta es del consejo pero no le toca responderlo"""
  viewerIsCouncilObserver: Boolean!
}

# ── Backend: módulo de votaciones ────────────────────────────────────────────
# El residente vota una vez por unidad (asamblea) o por persona (consejo) y ve
# los resultados al cerrarse. Borrar cuando el backend lo despliegue.

enum VotingMeetingKind {
  ASAMBLEA
  CONSEJO
}

enum VoteWeighting {
  COEFFICIENT
  UNIT
  MEMBER
}

enum VoteSecrecy {
  NOMINAL
  SECRET
}

enum VotingQuestionStatus {
  DRAFT
  OPEN
  CLOSED
}

type VotingOption {
  id: String!
  questionId: String!
  position: Int!
  text: String!
}

type VotingOptionResult {
  optionId: String!
  text: String!
  votes: Int!
  weight: Float!
  share: Float!
  shareOfEligible: Float!
}

type VotingResults {
  weighting: VoteWeighting!
  eligibleCount: Int!
  eligibleWeight: Float!
  votedCount: Int!
  votedWeight: Float!
  participation: Float!
  options: [VotingOptionResult!]!
  participants: [String!]
}

type VotingQuestion {
  id: String!
  meetingId: String!
  meeting: VotingMeeting
  position: Int!
  text: String!
  description: String
  weighting: VoteWeighting!
  secrecy: VoteSecrecy!
  status: VotingQuestionStatus!
  openedAt: DateTime
  closedAt: DateTime
  options: [VotingOption!]
