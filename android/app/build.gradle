apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"


// Los nombres tienen que coincidir EXACTO con los archivos de
// node_modules/react-native-vector-icons/Fonts. Aquí decía 'IonicIcons.ttf',
// que no existe —el archivo real es 'Ionicons.ttf'—, así que la fuente nunca se
// empaquetó y todo glifo de Ionicons salía en blanco: los iconos de los diálogos
// de AlertContext incluidos. fonts.gradle no falla ni avisa cuando el nombre no
// corresponde a ningún archivo.
project.ext.vectoricons = [
    iconFontNames: [ 'MaterialIcons.ttf', 'Ionicons.ttf' ]
]
/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    // Bundle JS in ALL variants — debug APK works without Metro running
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

/**
 * R8 (minificar y ofuscar el bytecode) en release. Play marca como problema una
 * ofuscación DEX por debajo del 25 %, y con esto apagado estaba en 2 %.
 * Las reglas propias viven en proguard-rules.pro; las librerías traen las suyas.
 * shrinkResources sigue apagado: la notificación de pánico busca su ícono por
 * nombre y el recorte de recursos podría quitarlo.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// `versionName` sale de package.json para que no haya dos versiones que
// mantener sincronizadas a mano: el pie del perfil ya lee la misma. Se bumpea
// con `yarn version`.
//
// `versionCode` NO se deriva de ahí: Play exige que crezca en CADA subida, y un
// semver no da ese entero de forma inequívoca (0.3.1 y 0.4.0 tendrían que
// ordenarse solos). Se sube a mano abajo, y equivocarse es visible: Play
// rechaza el AAB si el número ya se usó.
def appVersionName = new groovy.json.JsonSlurper()
        .parseText(file("../../package.json").text)
        .version

// Release signing credentials live OUTSIDE the repo in android/keystore.properties
// (gitignored). Si el archivo falta (CI sin secretos, clon recien hecho), los
// builds de release/aab FALLAN a proposito — ver el bloque gradle.taskGraph al
// final. Para compilar sin la llave real, usa la variante `staging`.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }

    // El archivo a medio llenar es un caso real: se crea vacío al seguir la guía
    // y se rellena después. Sin esta comprobación, Gradle fallaba con
    // "Cannot convert 'null' to File", que no dice nada de lo que hay que hacer.
    def required = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD',
                    'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
    def missing = required.findAll { !keystoreProperties[it]?.trim() }

    if (missing) {
        throw new GradleException(
            "android/keystore.properties existe pero le faltan: ${missing.join(', ')}.\n" +
            "Complétalo con los valores reales (ver keystore.properties.example). " +
            "Si solo quieres un build de QA, usa la variante staging.")
    }

    def storeFile = file(keystoreProperties['RELEASE_STORE_FILE'])
    if (!storeFile.exists()) {
        throw new GradleException(
            "RELEASE_STORE_FILE apunta a ${storeFile}, que no existe. La ruta se " +
            "resuelve desde android/app/.")
    }

    hasReleaseSigning = true
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.alternaqj.remotelink"
    defaultConfig {
        applicationId "com.alternaqj.remotelink"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Súbelo en 1 en CADA subida a Play, aunque el versionName no cambie.
        versionCode 11
        versionName appVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties['RELEASE_STORE_FILE'])
                storePassword keystoreProperties['RELEASE_STORE_PASSWORD']
                keyAlias keystoreProperties['RELEASE_KEY_ALIAS']
                keyPassword keystoreProperties['RELEASE_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Allow HTTP to local dev backend
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            // Aqui hubo un fallback a la llave de debug cuando faltaba
            // keystore.properties. Se quito: un release firmado con debug se ve
            // igual que uno bueno hasta que Play lo rechaza — o hasta que lo
            // distribuyes creyendo que era el real. Sin credenciales, el build
            // de release falla con el mensaje del bloque gradle.taskGraph del
            // final del archivo. `staging` sigue firmando con debug a proposito.
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
        staging {
            // Release-like build pointing at the staging backend (see .env.staging).
            // Keeps console logs (babel only strips console on production builds).
            // Signed with the debug keystore for sideload/QA, not for Play Store.
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Sin credenciales de firma, un build de release se detiene aqui en vez de
// producir un artefacto firmado con la llave de debug.
//
// El filtro va por RUTA de tarea del modulo :app, no por `name.contains('Release')`.
// Ese atajo tenia un falso positivo que bloqueaba `staging`: con
// matchingFallbacks los modulos de libreria compilan su variante release, asi
// que el grafo de assembleStaging incluye tareas como
// :react-native-screens:compileReleaseJavaWithJavac.
gradle.taskGraph.whenReady { taskGraph ->
    def releaseEntryPoints = ~/^:app:(assemble|bundle|install|package)Release$/
    def isRelease = taskGraph.allTasks.any { it.path ==~ releaseEntryPoints }
    if (isRelease && !hasReleaseSigning) {
        throw new RuntimeException(
            "\n\n[ERROR] BUILD DE RELEASE BLOQUEADO: falta android/keystore.properties.\n" +
            "   Copia android/keystore.properties.example a android/keystore.properties\n" +
            "   y rellenalo con los valores reales. El archivo esta en .gitignore.\n" +
            "   Para un build de QA sin la llave real, usa assembleStaging.\n"
        )
    }
}
